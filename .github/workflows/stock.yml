name: OliveYoung Stock

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: oliveyoung-stock-main
  cancel-in-progress: false

jobs:
  collect:
    # Playwright 1.58.2 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - run: node scripts/detail-stock.mjs

      - name: Merge latest data and push
        shell: bash
        run: |
          set -euo pipefail

          cp public/data/stock-detail.json /tmp/generated-stock-detail.json
          cp public/data/history.json /tmp/generated-history.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/generated-stock-detail.json public/data/stock-detail.json
            cp /tmp/generated-history.json public/data/history.json
            git add \
              public/data/stock-detail.json \
              public/data/history.json

            if git diff --staged --quiet; then
              echo "No stock data changes to publish."
              exit 0
            fi

            git commit -m "stock data $(TZ=Asia/Seoul date +%m/%d\ %H:%M)"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::main changed while publishing; retrying merge (${attempt}/3)."
            sleep $((attempt * 3))
          done

          echo "::error::Unable to publish stock data after 3 merge attempts."
          exit 1
