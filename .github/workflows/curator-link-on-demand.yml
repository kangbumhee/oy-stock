name: Generate Curator Link On Demand

on:
  workflow_dispatch:
    inputs:
      goodsNos:
        description: 'Comma or whitespace separated OliveYoung goods numbers'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: curator-link-on-demand-main
  cancel-in-progress: false

jobs:
  generate:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      succeeded: ${{ steps.attempt.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            .github/actions/generate-curator-links
            package.json
            package-lock.json
            scripts
            public/data
          sparse-checkout-cone-mode: false

      - name: Generate requested curator links (primary runner)
        id: attempt
        continue-on-error: true
        uses: ./.github/actions/generate-curator-links
        with:
          goods-nos: ${{ inputs.goodsNos }}
          max-goods: '260'
          include-live-ranking: '0'
        env:
          OY_CURATOR_COOKIE: ${{ secrets.OY_CURATOR_COOKIE }}
          OY_REFRESH_COOKIE: ${{ secrets.OY_REFRESH_COOKIE }}
          OY_SESSION_ID: ${{ secrets.OY_SESSION_ID }}
          OY_LINKAGE_STRING: ${{ secrets.OY_LINKAGE_STRING }}
          OY_LINKAGE_JWT: ${{ secrets.OY_LINKAGE_JWT }}
          OLIVEYOUNG_LINKAGE_STRING: ${{ secrets.OLIVEYOUNG_LINKAGE_STRING }}
          OLIVEYOUNG_LINKAGE_JWT: ${{ secrets.OLIVEYOUNG_LINKAGE_JWT }}
          OLIVEYOUNG_AFFILIATE_REGISTER_ID: ${{ secrets.OLIVEYOUNG_AFFILIATE_REGISTER_ID }}

      - name: Schedule a fresh runner retry
        if: steps.attempt.outcome != 'success'
        shell: bash
        run: |
          echo "::warning::The primary runner was blocked or failed. Retrying on a fresh runner."

  generate-retry:
    needs: generate
    if: ${{ always() && needs.generate.outputs.succeeded != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            .github/actions/generate-curator-links
            package.json
            package-lock.json
            scripts
            public/data
          sparse-checkout-cone-mode: false

      - name: Generate requested curator links (fresh runner retry)
        uses: ./.github/actions/generate-curator-links
        with:
          goods-nos: ${{ inputs.goodsNos }}
          max-goods: '260'
          include-live-ranking: '0'
        env:
          OY_CURATOR_COOKIE: ${{ secrets.OY_CURATOR_COOKIE }}
          OY_REFRESH_COOKIE: ${{ secrets.OY_REFRESH_COOKIE }}
          OY_SESSION_ID: ${{ secrets.OY_SESSION_ID }}
          OY_LINKAGE_STRING: ${{ secrets.OY_LINKAGE_STRING }}
          OY_LINKAGE_JWT: ${{ secrets.OY_LINKAGE_JWT }}
          OLIVEYOUNG_LINKAGE_STRING: ${{ secrets.OLIVEYOUNG_LINKAGE_STRING }}
          OLIVEYOUNG_LINKAGE_JWT: ${{ secrets.OLIVEYOUNG_LINKAGE_JWT }}
          OLIVEYOUNG_AFFILIATE_REGISTER_ID: ${{ secrets.OLIVEYOUNG_AFFILIATE_REGISTER_ID }}
