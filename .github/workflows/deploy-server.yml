name: Deploy Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validate required deployment secrets
        env:
          PRICE_ALERT_SERVICE_SECRET: '${{ secrets.PRICE_ALERT_SERVICE_SECRET }}'
        run: |
          if [ -z "$PRICE_ALERT_SERVICE_SECRET" ]; then
            echo '::error::PRICE_ALERT_SERVICE_SECRET is not configured'
            exit 1
          fi

      - name: Deploy to Cloud Run
        env:
          PRICE_ALERT_SERVICE_SECRET: '${{ secrets.PRICE_ALERT_SERVICE_SECRET }}'
        run: |
          gcloud run deploy oy-stock-api \
            --source . \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 1 \
            --concurrency 4 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 240 \
            --cpu-throttling \
            --update-env-vars "^~^PLAYWRIGHT_BROWSERS_PATH=/ms-playwright~OY_CURATOR_COOKIE=${{ secrets.OY_CURATOR_COOKIE }}~OY_REFRESH_COOKIE=${{ secrets.OY_REFRESH_COOKIE }}~OY_SESSION_ID=${{ secrets.OY_SESSION_ID }}~OY_LINKAGE_STRING=${{ secrets.OY_LINKAGE_STRING }}~OY_LINKAGE_JWT=${{ secrets.OY_LINKAGE_JWT }}~OLIVEYOUNG_LINKAGE_STRING=${{ secrets.OLIVEYOUNG_LINKAGE_STRING }}~OLIVEYOUNG_LINKAGE_JWT=${{ secrets.OLIVEYOUNG_LINKAGE_JWT }}~OLIVEYOUNG_AFFILIATE_REGISTER_ID=${{ secrets.OLIVEYOUNG_AFFILIATE_REGISTER_ID }}~CURATOR_LIVE_SECRET=${{ secrets.CURATOR_LIVE_SECRET }}~PRICE_ALERT_SERVICE_SECRET=${PRICE_ALERT_SERVICE_SECRET}~PRICE_LOOKUP_CONCURRENCY=1~PRICE_LOOKUP_PACE_MS=1000~PRICE_LOOKUP_WINDOW_MAX=20~PRICE_LOOKUP_WINDOW_MS=60000~PRICE_LOOKUP_TOTAL_TIMEOUT_MS=180000" \
            --clear-base-image \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Health Check
        run: |
          # gcloud deploy waits for the revision to become ready; retries below handle session warm-up.
          sleep 5
          curl -fsS --max-time 15 \
            "https://oy-stock-api-3596046881.asia-northeast3.run.app/health?warm=1&curator=1" \
            > /dev/null || true

          node - <<'NODE'
          const SEARCH_TIMEOUT_MS = 45000;
          const RETRY_DELAY_MS = 4000;
          const MAX_ATTEMPTS = 3;
          const baseUrl = 'https://oy-stock-api-3596046881.asia-northeast3.run.app/api/search';

          const checks = [
            {
              name: 'unove',
              url: `${baseUrl}?keyword=%EC%96%B4%EB%85%B8%EB%B8%8C&size=48`,
              limit: 48,
              validate({ total, count, expected }) {
                return total >= 15 && count >= 15 && count === expected;
              }
            },
            {
              name: 'shampoo-pagination',
              url: `${baseUrl}?keyword=%EC%83%B4%ED%91%B8&size=120`,
              limit: 120,
              validate({ total, count, expected }) {
                return total >= 120 && count === 120 && count === expected;
              }
            }
          ];

          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchPayload(url) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), SEARCH_TIMEOUT_MS);
            try {
              const response = await fetch(url, {
                headers: { Accept: 'application/json' },
                signal: controller.signal
              });
              if (!response.ok) throw new Error(`http_${response.status}`);
              const text = await response.text();
              try {
                return JSON.parse(text);
              } catch {
                throw new Error('invalid_json');
              }
            } catch (error) {
              if (error && error.name === 'AbortError') throw new Error('timeout');
              throw error;
            } finally {
              clearTimeout(timeout);
            }
          }

          function inspectPayload(payload, limit) {
            const inventory = payload && payload.data && payload.data.inventory;
            const products = inventory && Array.isArray(inventory.products) ? inventory.products : [];
            const total = Number(inventory && inventory.totalCount);
            const expected = Number.isInteger(total) ? Math.min(total, limit) : -1;
            const flagsValid =
              payload &&
              payload.success === true &&
              payload.complete === true &&
              payload.incomplete === false;
            return {
              flagsValid,
              total,
              count: products.length,
              expected
            };
          }

          async function checkWithRetry(check) {
            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
              try {
                const payload = await fetchPayload(check.url);
                const state = inspectPayload(payload, check.limit);
                if (!state.flagsValid || !Number.isInteger(state.total) || !check.validate(state)) {
                  throw new Error(
                    `incomplete total=${Number.isInteger(state.total) ? state.total : 'invalid'} ` +
                      `count=${state.count} expected=${state.expected}`
                  );
                }
                console.log(`[readiness] ${check.name} passed on attempt ${attempt}`);
                return;
              } catch (error) {
                console.error(
                  `[readiness] ${check.name} attempt ${attempt}/${MAX_ATTEMPTS} failed: ` +
                    `${error.message || 'unknown_error'}`
                );
                if (attempt < MAX_ATTEMPTS) await delay(RETRY_DELAY_MS);
              }
            }
            throw new Error(`${check.name}_readiness_failed`);
          }

          (async () => {
            try {
              for (const check of checks) await checkWithRetry(check);
            } catch {
              console.error('::error::Cloud Run search readiness checks failed');
              process.exitCode = 1;
            }
          })();
          NODE
